spring:
  application:
    name: cartograph
  # Flyway does not ship SQLite support in flyway-core alone. Keep migration
  # execution explicitly off until the SQLite-compatible equivalent is added
  # with the persistence slice (Task 6).
  flyway:
    enabled: false
  datasource:
    url: jdbc:sqlite:${cartograph.sqlite.path}?foreign_keys=on&journal_mode=wal&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC

server:
  port: 8080

logging:
  structured:
    format:
      console: logstash
  pattern:
    level: "%5p [%X{correlationId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    git:
      mode: full

cartograph:
  sqlite:
    path: ./data/cartograph.db
  persistence:
    retention-per-repo: 10
  github:
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    max-files: 10000
    max-total-bytes: 1073741824
    max-file-bytes: 10485760
    max-response-bytes: 33554432
    max-attempts: 3
    retry-backoff-millis: 250
    max-retry-sleep-millis: 5000
    connect-timeout-millis: 5000
    read-timeout-millis: 15000
    cache-max-entries: 256
    cache-max-bytes: 16777216
    clone:
      enabled: true
      file-threshold: 10000
      timeout-seconds: 120
      cleanup-timeout-seconds: 10
      executable: git
  ratelimit:
    enabled: true
    capacity: 30
    refill-per-minute: 60
  cors:
    allowed-origins: []
  prewarm:
    enabled: false
    repositories: []
  idempotency:
    ttl-seconds: 86400
    max-entries: 1000
